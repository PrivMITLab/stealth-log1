version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stealth
      POSTGRES_PASSWORD: stealth
      POSTGRES_DB: stealthlog
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_TYPE: postgres
      DATABASE_URL: postgres://stealth:stealth@db:5432/stealthlog
      JWT_SECRET: change-me-in-production
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me-strong
      REDIRECT_URL: https://www.google.com
    ports: ["3000:3000"]
    depends_on: [db]
volumes:
  pgdata:
